map $http_host $host_canonico_local {
  default "";
  ~^127\.0\.0\.1(?<puerto_local>:[0-9]+)?$ localhost$puerto_local;
}

server {
  listen 8080;
  listen [::]:8080;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The local identity provider and its allowed redirects use localhost.
  # Keep the externally published port and the complete document-request URL.
  if ($host_canonico_local != "") {
    return 308 $scheme://$host_canonico_local$request_uri;
  }

  location /api/ {
    proxy_pass http://api:8080/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /config.js {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /pdfjs/pdf.worker.min.mjs {
    default_type application/javascript;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
